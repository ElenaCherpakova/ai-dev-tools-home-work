<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}TODO App{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        nav {
            background-color: #333;
            padding: 15px 20px;
            margin-bottom: 30px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }
        
        nav a:hover {
            color: #4CAF50;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #555;
            margin-bottom: 15px;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <a href="{% url 'todo-list' %}">Home</a>
        <a href="{% url 'todo-create' %}">Create TODO</a>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
