{% extends 'base.html' %}

{% block title %}Delete TODO{% endblock %}

{% block extra_css %}
<style>
    .delete-warning {
        background-color: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: 4px;
        padding: 15px;
        margin-bottom: 20px;
    }
    
    .delete-warning p {
        color: #856404;
        margin: 0;
    }
    
    form {
        margin-top: 20px;
    }
    
    button {
        background-color: #dc3545;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    
    button:hover {
        background-color: #c82333;
    }
    
    a {
        background-color: #999;
        color: white;
        padding: 10px 20px;
        border-radius: 4px;
        text-decoration: none;
        margin-left: 10px;
        display: inline-block;
    }
    
    a:hover {
        background-color: #777;
    }
</style>
{% endblock %}

{% block content %}
<h1>Delete TODO</h1>

<div class="delete-warning">
    <p>Are you sure you want to delete "{{ todo.title }}"?</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'todo-list' %}">Cancel</a>
</form>
{% endblock %}
